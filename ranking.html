<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Samurai Western Rank</title>
    <style>
        body { background: #0d1117; color: white; text-align: center; font-family: sans-serif; }
        .box { background: #161b22; width: 350px; margin: 50px auto; padding: 20px; border-radius: 10px; border: 1px solid #30363d; }
        .item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #21262d; }
    </style>
</head>
<body>
    <h1>🏆 World Ranking</h1>
    <div class="box" id="board">불러오는 중... (안 나오면 자물쇠 아이콘 설정 확인)</div>

    <script>
        // 상진님, 이 주소는 깃허브 보안 정책 때문에 브라우저 설정 변경이 필요할 수 있습니다.
        const url = "https://www.dreamlo.com/lb/6798993f8f40bb12f06b9a89/json";
        
        fetch(url)
            .then(r => r.json())
            .then(d => {
                let e = d.dreamlo.leaderboard.entry;
                if(!e) { document.getElementById('board').innerHTML = "기록 없음"; return; }
                if(!Array.isArray(e)) e = [e];
                let h = "";
                e.slice(0, 10).forEach((p, i) => {
                    h += `<div class="item"><span>${i+1}. ${p.name}</span><span>${p.score}s</span></div>`;
                });
                document.getElementById('board').innerHTML = h;
            })
            .catch(() => {
                document.getElementById('board').innerHTML = "보안 차단됨<br><br>주소창 자물쇠 버튼 -> 사이트 설정 -> '안전하지 않은 콘텐츠' 허용 후 새로고침하세요!";
            });
    </script>
</body>
</html>
